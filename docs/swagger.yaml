basePath: /
definitions:
  auth.Result:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        example: test@example.com
        type: string
      password:
        example: test-password-123
        maxLength: 72
        minLength: 8
        type: string
    type: object
  auth.registerRequest:
    properties:
      email:
        example: test@example.com
        type: string
      name:
        example: Test User
        type: string
      password:
        example: test-password-123
        maxLength: 72
        minLength: 8
        type: string
    type: object
  health.probeResponse:
    properties:
      status:
        type: string
    type: object
  sheetbooking.Booking:
    properties:
      end_date:
        type: string
      end_time:
        type: string
      id:
        type: string
      name:
        type: string
      room:
        type: string
      start_date:
        type: string
      start_time:
        type: string
    type: object
  sheetbooking.errorResponse:
    properties:
      error:
        type: string
    type: object
  user.User:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: Email/password authentication with one-hour stateless bearer JWTs and
    OS-only live spreadsheet bookings. OAuth integration is planned.
  title: Chula Room Booking API
  version: 0.1.0
paths:
  /api/v1/admin/sheet-bookings:
    get:
      description: Requires a currently active OS or ADMIN user. Reads the configured
        Google Sheet on every request and returns seven string fields per row.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sheetbooking.Booking'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
      security:
      - BearerAuth: []
      summary: List OS spreadsheet bookings
      tags:
      - sheet-bookings
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Returns a one-hour bearer JWT. Invalid credentials, disabled accounts,
        and accounts without passwords receive the same error.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Validates the JWT and loads the current active user from PostgreSQL;
        role changes apply immediately.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Name must be nonempty; email is trimmed and lowercased; password
        must be 8-72 bytes. Unknown fields are rejected. Available in all environments.
      parameters:
      - description: Registration credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.Result'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Register with email and password
      tags:
      - auth
  /healthz:
    get:
      description: Returns ok while the process is running; does not query PostgreSQL.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check liveness
      tags:
      - health
  /readyz:
    get:
      description: Pings PostgreSQL with a two-second timeout.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ready'
          schema:
            $ref: '#/definitions/health.probeResponse'
        "503":
          description: 'status: unavailable'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check readiness
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Enter Bearer followed by a space and your access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
