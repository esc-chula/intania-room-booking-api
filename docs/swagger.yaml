basePath: /
definitions:
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  health.probeResponse:
    properties:
      status:
        type: string
    type: object
  sheetbooking.Booking:
    properties:
      conflicted:
        type: boolean
      end_date:
        type: string
      end_time:
        type: string
      id:
        type: string
      name:
        type: string
      room:
        type: string
      start_date:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  sheetbooking.CalendarResult:
    properties:
      days:
        items:
          $ref: '#/definitions/sheetbooking.Day'
        type: array
      month:
        type: integer
      year:
        type: integer
    type: object
  sheetbooking.Counts:
    properties:
      approved:
        type: integer
      cancelled:
        type: integer
      conflicted:
        type: integer
      needs_revision:
        type: integer
      submitted:
        type: integer
      timeline:
        type: integer
    type: object
  sheetbooking.Day:
    properties:
      counts:
        $ref: '#/definitions/sheetbooking.Counts'
      date:
        type: string
    type: object
  sheetbooking.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/sheetbooking.Booking'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  sheetbooking.WeeklyBooking:
    properties:
      end_at:
        type: string
      has_conflict:
        type: boolean
      id:
        type: string
      start_at:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  sheetbooking.WeeklyResult:
    properties:
      end_date:
        type: string
      rooms:
        items:
          $ref: '#/definitions/sheetbooking.WeeklyRoom'
        type: array
      start_date:
        type: string
    type: object
  sheetbooking.WeeklyRoom:
    properties:
      bookings:
        items:
          $ref: '#/definitions/sheetbooking.WeeklyBooking'
        type: array
      building:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  sheetbooking.errorResponse:
    properties:
      error:
        type: string
    type: object
  user.User:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: Google OAuth sign-in sets a one-hour HttpOnly authentication cookie.
    OS-only live spreadsheet bookings are available to authenticated users.
  title: Chula Room Booking API
  version: 0.1.0
paths:
  /api/v1/admin/sheet-bookings:
    get:
      description: Requires OS or ADMIN. Reads a 60-second cached Sheet snapshot.
      parameters:
      - description: Calendar year; requires month
        in: query
        name: year
        type: integer
      - description: Month 1-12; requires year
        in: query
        name: month
        type: integer
      - description: ENG building name
        in: query
        name: building
        type: string
      - description: approved, cancelled, submitted, timeline, needs_revision, or
          conflicted
        in: query
        name: status
        type: string
      - description: Page number, default 1
        in: query
        name: page
        type: integer
      - description: Page size, default 20, maximum 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sheetbooking.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
      summary: List OS spreadsheet bookings
      tags:
      - sheet-bookings
  /api/v1/admin/sheet-bookings/calendar:
    get:
      description: Requires OS or ADMIN. Conflicted counts active bookings overlapping
        the same room and daily time window.
      parameters:
      - description: Calendar year
        in: query
        name: year
        required: true
        type: integer
      - description: Month 1-12
        in: query
        name: month
        required: true
        type: integer
      - description: ENG building name
        in: query
        name: building
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sheetbooking.CalendarResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
      summary: Monthly OS spreadsheet booking calendar
      tags:
      - sheet-bookings
  /api/v1/admin/sheet-bookings/weekly:
    get:
      description: Requires OS or ADMIN. Uses the shared 60-second cached Sheet snapshot.
        Dates are inclusive and use Bangkok time.
      parameters:
      - description: Start date YYYY-MM-DD; defaults to today in Bangkok
        in: query
        name: start_date
        type: string
      - description: End date YYYY-MM-DD; defaults to six days after start_date
        in: query
        name: end_date
        type: string
      - description: ENG 3, ENG 100, or ENG 4
        in: query
        name: building
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sheetbooking.WeeklyResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
      summary: Weekly OS spreadsheet room schedule
      tags:
      - sheet-bookings
  /api/v1/auth/logout:
    post:
      description: Clears the application auth cookie; an already issued JWT expires
        at its original time.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Validates the JWT and loads the current active user from PostgreSQL;
        role changes apply immediately.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Get current user
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Redirects to FRONTEND_URL on success or /login?auth_error=code
        on failure. Never exposes a token in the URL or response body.
      responses:
        "302":
          description: Found
      summary: Complete Google sign-in
      tags:
      - auth
  /auth/google/login:
    get:
      description: Sets a temporary state cookie and redirects to Google.
      responses:
        "302":
          description: Found
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Start Google sign-in
      tags:
      - auth
  /auth/google/url:
    get:
      description: Development only. The same browser must retain the temporary cookie
        when following auth_url.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Get Google authorization URL
      tags:
      - auth
  /healthz:
    get:
      description: Returns ok while the process is running; does not query PostgreSQL.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check liveness
      tags:
      - health
  /readyz:
    get:
      description: Pings PostgreSQL with a two-second timeout.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ready'
          schema:
            $ref: '#/definitions/health.probeResponse'
        "503":
          description: 'status: unavailable'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check readiness
      tags:
      - health
swagger: "2.0"
