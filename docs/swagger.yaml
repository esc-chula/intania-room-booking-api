basePath: /
definitions:
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  health.probeResponse:
    properties:
      status:
        type: string
    type: object
  sheetbooking.Booking:
    properties:
      end_date:
        type: string
      end_time:
        type: string
      id:
        type: string
      name:
        type: string
      room:
        type: string
      start_date:
        type: string
      start_time:
        type: string
    type: object
  sheetbooking.errorResponse:
    properties:
      error:
        type: string
    type: object
  user.User:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: Google OAuth sign-in sets a one-hour HttpOnly authentication cookie.
    OS-only live spreadsheet bookings are available to authenticated users.
  title: Chula Room Booking API
  version: 0.1.0
paths:
  /api/v1/admin/sheet-bookings:
    get:
      description: Requires a currently active OS or ADMIN user. Reads the configured
        Google Sheet on every request and returns seven string fields per row.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sheetbooking.Booking'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/sheetbooking.errorResponse'
      summary: List OS spreadsheet bookings
      tags:
      - sheet-bookings
  /api/v1/auth/logout:
    post:
      description: Clears the application auth cookie; an already issued JWT expires
        at its original time.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Validates the JWT and loads the current active user from PostgreSQL;
        role changes apply immediately.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Get current user
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Redirects to FRONTEND_URL on success or /login?auth_error=code
        on failure. Never exposes a token in the URL or response body.
      responses:
        "302":
          description: Found
      summary: Complete Google sign-in
      tags:
      - auth
  /auth/google/login:
    get:
      description: Sets a temporary state cookie and redirects to Google.
      responses:
        "302":
          description: Found
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Start Google sign-in
      tags:
      - auth
  /auth/google/url:
    get:
      description: Development only. The same browser must retain the temporary cookie
        when following auth_url.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Get Google authorization URL
      tags:
      - auth
  /healthz:
    get:
      description: Returns ok while the process is running; does not query PostgreSQL.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check liveness
      tags:
      - health
  /readyz:
    get:
      description: Pings PostgreSQL with a two-second timeout.
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ready'
          schema:
            $ref: '#/definitions/health.probeResponse'
        "503":
          description: 'status: unavailable'
          schema:
            $ref: '#/definitions/health.probeResponse'
      summary: Check readiness
      tags:
      - health
swagger: "2.0"
