name: migrate-down
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the production project ID to confirm rollback
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-personal-test
  cancel-in-progress: false
jobs:
  database:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: database-production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - name: Confirm target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: test -n "$PROJECT_ID" && test "$CONFIRMATION" = "$PROJECT_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DATABASE_SA }}
      - name: Verify database target
        run: python3 .github/scripts/check-database-target.py
      - name: Start Cloud SQL Auth Proxy
        run: |
          set -eu
          : "${DATABASE_URL:?}" "${INSTANCE_CONNECTION_NAME:?}"
          curl --fail --silent --show-error --location https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64 -o "$RUNNER_TEMP/cloud-sql-proxy"
          chmod +x "$RUNNER_TEMP/cloud-sql-proxy"
          "$RUNNER_TEMP/cloud-sql-proxy" --address 127.0.0.1 --port 5433 "$INSTANCE_CONNECTION_NAME" > "$RUNNER_TEMP/cloud-sql-proxy.log" 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Cloud SQL Auth Proxy did not become ready.' >&2
          exit 1
      - name: Install Goose
        run: GOBIN="$PWD/.bin" go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Run command
        run: make migrate-down
