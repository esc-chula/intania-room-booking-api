name: Sync runtime secrets
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-personal-test
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra-apply
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SECRETS_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Add secret versions
        run: |
          set -eu
          : "${PROJECT_ID:?}" "${DATABASE_URL:?}" "${JWT_SECRET:?}" "${GOOGLE_CLIENT_SECRET:?}"
          for entry in database-url jwt-secret google-client-secret; do
            case "$entry" in
              database-url) value="$DATABASE_URL" ;;
              jwt-secret) value="$JWT_SECRET" ;;
              google-client-secret) value="$GOOGLE_CLIENT_SECRET" ;;
            esac
            version="$(printf '%s' "$value" | gcloud secrets versions add "room-booking-$entry" --project "$PROJECT_ID" --data-file=- --format='value(name)')"
            version="${version##*/}"
            case "$version" in ''|*[!0-9]*) echo 'Invalid secret version returned.' >&2; exit 1 ;; esac
            printf '%s: %s\n' "$entry" "$version" >> "$GITHUB_STEP_SUMMARY"
          done
