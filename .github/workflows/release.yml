name: Release
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from a successful main CI run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: terraform-personal-test
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: personal-release
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_REGISTRY }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_spreadsheet_id: ${{ vars.GOOGLE_SPREADSHEET_ID }}
      TF_VAR_sheet_range: ${{ vars.GOOGLE_SHEET_RANGE }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful main build
        run: |
          set -eu
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${COMMIT_SHA}&per_page=100" --jq '.workflow_runs[] | select(.conclusion == "success") | .id' > "$RUNNER_TEMP/successful-runs"
          test -s "$RUNNER_TEMP/successful-runs" || { echo 'No successful main CI run for this SHA' >&2; exit 1; }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Resolve image digest and plan release
        run: |
          set -eu
          : "${PROJECT_ID:?}" "${REGION:?}" "${REPOSITORY:?}" "${STATE_BUCKET:?}" "${STATE_PREFIX:?}" "${TF_VAR_spreadsheet_id:?}" "${TF_VAR_sheet_range:?}"
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/api"
          digest="$(gcloud artifacts docker images describe "${image}:${COMMIT_SHA}" --project "$PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          export TF_VAR_image_url="${image}@${digest}"
          terraform -chdir=infra init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=$STATE_PREFIX"
          terraform -chdir=infra plan -input=false -out="$RUNNER_TEMP/release.tfplan"
          terraform -chdir=infra show -json "$RUNNER_TEMP/release.tfplan" | python3 .github/scripts/check-release-plan.py
      - name: Apply and check readiness
        run: |
          set -eu
          terraform -chdir=infra apply -input=false "$RUNNER_TEMP/release.tfplan"
          url="$(terraform -chdir=infra output -raw service_url)"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/readyz"
