services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: chula
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: chula_room_booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chula -d chula_room_booking"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
